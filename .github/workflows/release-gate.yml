name: release-gate

# 发布前四件门禁（串行测试 / db:verify / preflight / 迁移幂等）的 CI 版本。
# 判据与本地 `scripts/ops/release-gate.sh` 完全同源——不复制逻辑，只换数据库通道（psql URL 而非 docker exec）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: getgpt
          POSTGRES_PASSWORD: getgpt
          POSTGRES_DB: getgpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getgpt -d getgpt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://getgpt:getgpt@127.0.0.1:5432/getgpt
      TEST_DATABASE_URL: postgresql://getgpt:getgpt@127.0.0.1:5432/getgpt_test
      GATE_PSQL_URL: postgresql://getgpt:getgpt@127.0.0.1:5432/getgpt
      # demo 模式下 config.ts 只允许 localhost/127.0.0.1；CI 不做真实网络请求，给明确本地值
      APP_MODE: demo
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: 确保有 psql 客户端
        run: psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 生成 Prisma 客户端
        run: bun run db:generate

      - name: 建测试库
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE getgpt_test'

      - name: 初始化主库
        run: bun --bun scripts/init-database.ts

      # 注意：这里**不加重试**。测试里出现竞态应当修测试桩，不应让门禁学会重试——
      # 重试会把「随机红」变成「随机绿」，那比红更难发现。
      - name: 发布前四件门禁
        run: bash scripts/ops/release-gate.sh --psql-url "$GATE_PSQL_URL" --test-db getgpt_test

      - name: 失败时保留输出
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-logs
          path: |
            /tmp/gate*.log
          if-no-files-found: ignore
